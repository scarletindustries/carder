name = "carder"
version = "1.0.0"

description = "A compiler backend targeting the BEAM: a shared IR lowered to Core Erlang and compiled to loadable .beam modules. Frontends (WebAssembly, JavaScript) live in their own repos and consume this package."
licences = ["Apache-2.0"]
repository = { type = "github", user = "scarletindustries", repo = "carder" }
links = [{ title = "Website", href = "https://scarlet.industries" }]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
argv = ">= 1.1.0 and < 2.0.0"
simplifile = ">= 2.5.0 and < 3.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
