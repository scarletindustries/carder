name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

# carder is the compiler BACKEND: its input is the shared IR, never a source language. So this
# workflow needs NO source-toolchain machinery at all — no wabt, no wast2json, no vendored
# WebAssembly spec suite. That absence is the PROOF the frontend extraction was clean: if
# `gleam test` ever needs one of those again, something wasm-shaped has leaked back in.
# The WebAssembly spec suite lives in the scribbler repo, which runs it against this package.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.16.0"
          rebar3-version: "3"

      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test

      # Every Erlang FFI module in this package must carry the `carder_` prefix. BEAM module
      # names are one flat global atom namespace with no package scoping, so if a downstream
      # package (scribbler, arc) ships an .erl with the same module atom, one silently shadows
      # the other — NO compiler error and NO warning. This grep is the only defense.
      - name: FFI module atoms are package-prefixed
        run: |
          bad=$(ls src/*.erl test/*.erl 2>/dev/null | xargs -n1 basename | grep -v '^carder_' || true)
          if [ -n "$bad" ]; then
            echo "unprefixed .erl module(s) — they can silently shadow a dependency's:"
            echo "$bad"
            exit 1
          fi
